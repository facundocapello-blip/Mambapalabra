name: B1.11 QA - relojes y RESPONDER manual
on:
  push:
    branches: [fix/b111-dos-relojes-microfono-manual]
  pull_request:
    branches: [candidata-https-b111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Static source check and inline JS syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'id="handsFree"' not in s
          assert 'autoStartRecognition' not in s
          assert all('id="'+x+'"' in s for x in ['orbTimer1','orbTimer2','orbName1','orbName2'])
          assert 'qbzrqinnhrgeqvgtifrt' in s and 'mcrnstwmubtiiacyiaeu' not in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)
          assert len(scripts)==1,len(scripts)
          Path('check-inline.js').write_text(scripts[0])
          PY
          node --check check-inline.js
      - name: Playwright mobile regression
        env:
          MAMBA_BROWSER: ${{ matrix.browser }}
        run: python -m unittest discover -s tests -p test_ui_relojes_mic.py -v
